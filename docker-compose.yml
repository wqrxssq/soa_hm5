# Pinned images: confluentinc/cp-kafka:8.0.9, confluentinc/cp-schema-registry:8.0.9,
# clickhouse/clickhouse-server:25.8.33, grafana/grafana:12.3.11,
# alpine/minio:RELEASE.2025-10-15T17-29-55Z.
# Docker Hub no longer serves minio/minio; this Alpine tag is that same MinIO release.

x-kafka: &kafka
  image: confluentinc/cp-kafka:8.0.9
  environment: &kafka-env
    KAFKA_PROCESS_ROLES: broker,controller
    CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_NUM_PARTITIONS: 3
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    KAFKA_LOG_DIRS: /var/lib/kafka/data
    KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
  healthcheck:
    test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
    interval: 5s
    timeout: 10s
    retries: 40
    start_period: 20s

services:
  kafka-1:
    <<: *kafka
    hostname: kafka-1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:9092
    volumes:
      - kafka-1:/var/lib/kafka/data

  kafka-2:
    <<: *kafka
    hostname: kafka-2
    ports:
      - "9093:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29092,PLAINTEXT_HOST://localhost:9093
    volumes:
      - kafka-2:/var/lib/kafka/data

  kafka-3:
    <<: *kafka
    hostname: kafka-3
    ports:
      - "9094:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29092,PLAINTEXT_HOST://localhost:9094
    volumes:
      - kafka-3:/var/lib/kafka/data

  schema-registry:
    image: confluentinc/cp-schema-registry:8.0.9
    hostname: schema-registry
    ports:
      - "8085:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka-1:29092,PLAINTEXT://kafka-2:29092,PLAINTEXT://kafka-3:29092
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xmx256M"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/subjects"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  kafka-init:
    build:
      context: .
      dockerfile: docker/producer/Dockerfile
    entrypoint: ["/app/init"]
    environment:
      KAFKA_BROKERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    depends_on:
      schema-registry:
        condition: service_healthy
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:25.8.33
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: analytics
      CLICKHOUSE_DB: analytics
    ports:
      - "8123:8123"
    volumes:
      - ./db/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "default", "--password", "analytics", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s

  clickhouse-init:
    image: clickhouse/clickhouse-server:25.8.33
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./db/clickhouse/sql:/sql:ro
      - ./db/clickhouse/init.sh:/init.sh:ro
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: analytics
    ports:
      - "5434:5432"
    command: ["postgres", "-c", "timezone=UTC"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 2s
      timeout: 3s
      retries: 30

  flyway:
    image: flyway/flyway:11
    command: -url=jdbc:postgresql://postgres:5432/analytics -user=analytics -password=analytics -connectRetries=20 migrate
    volumes:
      - ./db/postgres/migration:/flyway/sql
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    # The image user is minio, but a new Docker volume is root-owned, so the process cannot create /data.
    user: "0:0"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: analytics
      MINIO_ROOT_PASSWORD: analyticssecret
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  minio-init:
    build:
      context: .
      dockerfile: docker/aggregation/Dockerfile
    entrypoint: ["/app/bucket"]
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: movie-analytics
      S3_ACCESS_KEY: analytics
      S3_SECRET_KEY: analyticssecret
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  producer:
    build:
      context: .
      dockerfile: docker/producer/Dockerfile
    ports:
      - "8090:8080"
    environment:
      HTTP_ADDR: ":8080"
      KAFKA_BROKERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      GENERATOR_ENABLED: "true"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  aggregation:
    build:
      context: .
      dockerfile: docker/aggregation/Dockerfile
    ports:
      - "8091:8080"
    environment:
      HTTP_ADDR: ":8080"
      CLICKHOUSE_DSN: clickhouse://default:analytics@clickhouse:9000/analytics?dial_timeout=10s&read_timeout=60s
      DATABASE_URL: postgres://analytics:analytics@postgres:5432/analytics?sslmode=disable
      AGGREGATION_INTERVAL: 1m
      EXPORT_INTERVAL: 24h
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: movie-analytics
      S3_ACCESS_KEY: analytics
      S3_SECRET_KEY: analyticssecret
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
      flyway:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  grafana:
    image: grafana/grafana:12.3.11
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource 4.24.0
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/movie.json
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 40s

volumes:
  kafka-1:
  kafka-2:
  kafka-3:
  clickhouse-data:
  minio-data:
