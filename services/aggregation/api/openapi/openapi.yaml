openapi: 3.0.3
info:
  title: Movie aggregation
  version: 1.0.0
  description: |
    Computes daily metrics from raw ClickHouse events, writes them to PostgreSQL
    and exports the day to MinIO.

servers:
  - url: /

paths:
  /health:
    get:
      operationId: health
      summary: Process health
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /recalculate:
    post:
      operationId: recalculate
      summary: Recalculate metrics for a date
      parameters:
        - $ref: "#/components/parameters/Date"
      responses:
        "200":
          description: Date was recalculated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DateResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "503":
          description: Metric storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /export:
    post:
      operationId: exportDay
      summary: Export aggregates for a date to object storage
      parameters:
        - $ref: "#/components/parameters/Date"
      responses:
        "200":
          description: Object was written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DateResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "503":
          description: PostgreSQL or object storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    Date:
      name: date
      in: query
      required: true
      schema:
        type: string
        format: date
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"

  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    DateResponse:
      type: object
      additionalProperties: false
      required: [status, date]
      properties:
        status:
          type: string
        date:
          type: string

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error_code, message]
      properties:
        error_code:
          type: string
          enum: [VALIDATION_ERROR, UNAVAILABLE, INTERNAL_ERROR, NOT_FOUND, METHOD_NOT_ALLOWED]
        message:
          type: string
        details:
          type: object
          nullable: true
          additionalProperties: true
